name: Build signed AAB (Google Play)

# Builds the release bundle that is uploaded to Google Play. It is signed with
# the Play *upload* key, which lives in GitHub secrets (never in the repo):
#   ANDROID_KEYSTORE_BASE64  base64 of sociobird-upload.jks   (base64 -w0 file.jks)
#   KEYSTORE_PASSWORD        keystore password
#   KEY_ALIAS                key alias (sociobird-upload)
#   KEY_PASSWORD             key password
on:
  workflow_dispatch:
    inputs:
      version_code:
        description: "versionCode (must be higher than the last upload to Play). Empty = value in build.gradle.kts"
        required: false
        type: string
      version_name:
        description: "versionName shown to users. Empty = value in build.gradle.kts"
        required: false
        type: string

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check the signing secrets exist
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KSP: ${{ secrets.KEYSTORE_PASSWORD }}
          KA: ${{ secrets.KEY_ALIAS }}
          KP: ${{ secrets.KEY_PASSWORD }}
        run: |
          for v in KS KSP KA KP; do
            if [ -z "${!v}" ]; then echo "::error::A signing secret is missing (see the comment at the top of this workflow)"; exit 1; fi
          done

      - name: Restore the upload keystore
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KS" | base64 -d > "$RUNNER_TEMP/upload.jks"
          {
            echo "storeFile=$RUNNER_TEMP/upload.jks"
            echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}"
            echo "keyAlias=${{ secrets.KEY_ALIAS }}"
            echo "keyPassword=${{ secrets.KEY_PASSWORD }}"
          } > keystore.properties

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build signed release bundle
        run: |
          ARGS=""
          if [ -n "${{ inputs.version_code }}" ]; then ARGS="$ARGS -PversionCode=${{ inputs.version_code }}"; fi
          if [ -n "${{ inputs.version_name }}" ]; then ARGS="$ARGS -PversionName=${{ inputs.version_name }}"; fi
          ./gradlew bundleRelease $ARGS

      - name: Verify the bundle is signed with the upload key
        run: jarsigner -verify app/build/outputs/bundle/release/app-release.aab

      - name: Upload the bundle
        uses: actions/upload-artifact@v4
        with:
          name: sociobird-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Remove the keystore from the runner
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks" keystore.properties
